<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="700" height="620" fill="#f5f6fa"/>

  <text x="350" y="55" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2333">Трекер привычек</text>

  <!-- form -->
  <rect x="70" y="85" width="440" height="44" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="112" font-size="15" fill="#9aa0ac">Например: пить воду, читать 20 минут...</text>
  <rect x="520" y="85" width="110" height="44" rx="8" fill="#4f46e5"/>
  <text x="575" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Добавить</text>

  <!-- filter bar -->
  <rect x="70" y="145" width="150" height="38" rx="8" fill="#4f46e5"/>
  <text x="145" y="169" text-anchor="middle" font-size="14" fill="#ffffff">Все</text>
  <rect x="230" y="145" width="150" height="38" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="305" y="169" text-anchor="middle" font-size="14" fill="#6b7280">Активные</text>
  <rect x="390" y="145" width="240" height="38" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="510" y="169" text-anchor="middle" font-size="14" fill="#6b7280">Выполненные</text>

  <text x="350" y="205" text-anchor="middle" font-size="14" fill="#6b7280">Выполнено 2 из 4</text>

  <!-- habit items -->
  <g>
    <rect x="70" y="225" width="560" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="88" y="244" width="16" height="16" rx="4" fill="none" stroke="#9aa0ac"/>
    <text x="118" y="257" font-size="15" fill="#1f2333">Пить 2 литра воды</text>
    <text x="608" y="257" font-size="15" fill="#e11d48">✕</text>
  </g>

  <g>
    <rect x="70" y="287" width="560" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="88" y="306" width="16" height="16" rx="4" fill="#16a34a" stroke="#16a34a"/>
    <path d="M91 314l3 3 8-8" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="118" y="319" font-size="15" fill="#9aa0ac" text-decoration="line-through">Читать 20 минут</text>
    <text x="608" y="319" font-size="15" fill="#e11d48">✕</text>
  </g>

  <g>
    <rect x="70" y="349" width="560" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="88" y="368" width="16" height="16" rx="4" fill="none" stroke="#9aa0ac"/>
    <text x="118" y="381" font-size="15" fill="#1f2333">Зарядка по утрам</text>
    <text x="608" y="381" font-size="15" fill="#e11d48">✕</text>
  </g>

  <g>
    <rect x="70" y="411" width="560" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="88" y="430" width="16" height="16" rx="4" fill="#16a34a" stroke="#16a34a"/>
    <path d="M91 438l3 3 8-8" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="118" y="443" font-size="15" fill="#9aa0ac" text-decoration="line-through">Медитация 10 минут</text>
    <text x="608" y="443" font-size="15" fill="#e11d48">✕</text>
  </g>

  <text x="350" y="600" text-anchor="middle" font-size="12" fill="#9aa0ac">Иллюстративный макет интерфейса приложения</text>
</svg>
